name: Release

on:
  push:
    tags:
      - "v*"
      - "1.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag"
        required: false
        default: "1.0.0"

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
          - os: ubuntu-22.04
            platform: linux-x64
          - os: macos-latest
            platform: macos-arm64
          - os: macos-13
            platform: macos-x64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            rpm \
            mold

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install npm dependencies
        run: npm install

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Build frontend
        run: npm run build:src

      - name: Build Tauri application
        run: npm run build:tauri

      - name: Prepare release assets (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          mkdir -p dist-release
          find target/release/bundle -type f \( -name "*.exe" -o -name "*.msi" \) -exec cp {} dist-release/ \;
          ls -la dist-release/

      - name: Prepare release assets (Linux)
        if: matrix.os == 'ubuntu-22.04'
        shell: bash
        run: |
          mkdir -p dist-release
          find target/release/bundle -type f \( -name "*.deb" -o -name "*.AppImage" -o -name "*.rpm" \) -exec cp {} dist-release/ \;
          if [ -f "target/release/premire" ]; then
            tar -czf dist-release/premire_1.0.0_linux_x64.tar.gz -C target/release premire
          fi
          ls -la dist-release/

      - name: Prepare release assets (macOS)
        if: startsWith(matrix.os, 'macos')
        shell: bash
        run: |
          mkdir -p dist-release
          find target/release/bundle -type f -name "*.dmg" -exec cp {} dist-release/ \;
          for app in target/release/bundle/macos/*.app; do
            if [ -d "$app" ]; then
              app_name=$(basename "$app" .app)
              zip -r "dist-release/${app_name}_1.0.0_${{ matrix.platform }}.app.zip" "$app"
            fi
          done
          ls -la dist-release/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: premire-binaries-${{ matrix.platform }}
          path: dist-release/*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine tag name
        id: release_info
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="1.0.0"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          path: all-artifacts

      - name: Collect artifacts and compute SHA256
        shell: bash
        run: |
          mkdir -p release-files
          find all-artifacts -type f -exec cp {} release-files/ \;
          cd release-files
          sha256sum * > ../SHA256SUMS.txt
          cat ../SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag }}
          name: "Premire ${{ steps.release_info.outputs.tag }}"
          draft: false
          prerelease: false
          generate_release_notes: false
          body: |
            ## Premire ${{ steps.release_info.outputs.tag }} — Next-Generation Autonomous AI Code Studio

            Premire is an open-source, locally running agentic development studio combining autonomous AI agents, Monaco code editing, isolated browser automation, integrated terminal, and extensible MCP tooling.

            ### 🚀 Highlights
            - **Autonomous Agentic Workflow** — Streamed reasoning, multi-turn tool execution, rollback, diff inspection, and context compaction.
            - **Integrated Browser Automation** — Isolated Chromium process controlled via Chrome DevTools Protocol (CDP) for live testing, web navigation, and research.
            - **Modern Workspace** — Monaco editor, ignore-aware search, Git staging/history/commit graph, and tabbed xterm.js terminal with shell detection.
            - **Model Context Protocol (MCP)** — Stdio/JSON-RPC 2.0 tool execution and server discovery.
            - **Provider Freedom** — Native support for Anthropic, OpenAI, Google Gemini, DeepSeek, Groq, Ollama, LM Studio, and any custom endpoint.
            - **Customization** — 40 bundled themes, editable palettes, custom fonts, and 38 languages.

            ### 📦 Download Links
            - **Windows**: `.exe` (NSIS Installer with English interface) & `.msi`
            - **macOS**: `.dmg` (Apple Silicon & Intel) & `.app.zip`
            - **Linux**: `.deb`, `.AppImage`, `.rpm`, `.tar.gz`

            ### 🔐 Checksums
            Verify your downloads using the included `SHA256SUMS.txt` file.
          files: |
            release-files/*
            SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
